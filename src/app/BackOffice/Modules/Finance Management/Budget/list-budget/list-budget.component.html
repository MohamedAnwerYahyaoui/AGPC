<main id="main" class="main">
    <div class="pagetitle">
      <h1>List of Budgets</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
          <li class="breadcrumb-item active">Budgets</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->
  
    <section class="section">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Budgets</h5>
  
              <!-- Search Input -->
              <input type="text" [(ngModel)]="searchText" class="form-control mb-3" placeholder="Search by name...">
  
              <!-- Material Prices Table -->
  
  
              <!-- Table with stripped rows -->
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Montant(TND)</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Description</th>
                    <th scope="col">Montant Left(TND)</th>
                    <th scope="col">Total Expenses(TND)</th>
                    <th scope="col">Tâche</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let n of filteredBudgets() | paginate: { itemsPerPage: 10, currentPage: page }">
                    <td>{{n?.id}}</td>
                    <td>{{n?.montant}}</td>
                    <td>{{n?.nom}}</td>
                    <td>{{n?.description}}</td>
                    <td>{{n?.montant_left}}</td>
                    <td>{{n?.totalExpenses}}</td> <!-- Display total expenses -->
                    <td>{{n?.tache?.nom}}</td>
                    <td>
                      <button class="btn btn-primary btn-sm" [routerLink]="['/dashboard/finance/UpdateBudget/', n.id]">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-danger btn-sm" (click)="deleteBudget(n.id)">
                        <i class="fas fa-trash-alt"></i>
                      </button>
                      <button class="btn btn-secondary btn-sm" (click)="generatePDF(n)">
                        <i class="fas fa-file-pdf"></i> Generate PDF
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <!-- End Table with stripped rows -->
  
              <pagination-controls (pageChange)="page = $event"></pagination-controls>
  
              <button class="btn btn-primary mt-3" (click)="openAddBudgetDialog()">
                <i class="fas fa-plus"></i> Add Budget
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
