<main id="main" class="main">
    <div class="pagetitle">
      <h1>Add Expense</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
          <li class="breadcrumb-item"><a routerLink="/dashboard/finance/expences">Expenses</a></li>
          <li class="breadcrumb-item active">Add Expense</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->
  
    <section class="section">
      <div class="row">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Add New Expense</h5>
  
              <!-- Expense Form -->
              <form [formGroup]="BudgetForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                  <label for="montant">Montant(TND)</label>
                  <input id="montant" formControlName="montant" class="form-control" type="number" required>
                </div>
  
                <div class="form-group">
                  <label for="description">Description</label>
                  <input id="description" formControlName="description" class="form-control" type="text" required>
                </div>
  
                <div class="form-group">
                  <label for="category">Category</label>
                  <select id="category" formControlName="category" class="form-control" required>
                    <option value="formations">Formations</option>
                    <option value="main_doeuvre">Main d'oeuvre</option>
                    <option value="equipement">Equipement</option>
                    <option value="materiaux">Matériaux</option>
                  </select>
                </div>
  
                <div class="form-group">
                  <label for="budget">Budget</label>
                  <select id="budget" formControlName="budget" class="form-control" required>
                    <option *ngFor="let budget of budgets" [ngValue]="budget">{{ budget.nom }}</option>
                  </select>
                </div>
  
                <button type="submit" class="btn btn-primary mt-3" [disabled]="BudgetForm.invalid">Add Expense</button>
              </form>
              <!-- End Expense Form -->
  
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
