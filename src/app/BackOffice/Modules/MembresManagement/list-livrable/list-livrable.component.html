<main id="main" class="main">
  <div class="container mt-4">
    <h2>Liste des livrables</h2>

    <!-- Barre de recherche -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input
          type="text"
          [(ngModel)]="searchText"
          placeholder="Recherche par nom"
          class="form-control"
        />
      </div>
    </div>

    <!-- Liste des livrables filtrée et paginée -->
    <div class="cards-container">
      <div
        class="card"
        *ngFor="let livrable of (livrables
          | livrableFilter : searchText
          | paginate : { itemsPerPage: 5, currentPage: page })"
      >
        <div class="card-header">Livrable {{ livrable.id }}</div>
        <div class="card-body">
          <p><strong>Nom:</strong> {{ livrable.nom }}</p>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary btn-sm" (click)="editLivrable(livrable.id!)">
            Modifier
          </button>
          <button class="btn btn-danger btn-sm" (click)="deleteLivrable(livrable.id!)">
            Supprimer
          </button>
        </div>
      </div>
    </div>

    <!-- Contrôles de pagination -->
    <pagination-controls (pageChange)="page = $event"></pagination-controls>

    <button class="btn btn-success" [routerLink]="['/dashboard/add-livrable']">
      Ajouter un livrable
    </button>
  </div>
</main>
