<main id="main" class="main">
  <div class="container mt-4">
    <h2>Liste des congés</h2>

    <!-- Barre de recherche et filtres -->
    <div class="row mb-3">
      <div class="col-md-3">
        <!-- Recherche par nom -->
        <input
          type="text"
          [(ngModel)]="searchText"
          (ngModelChange)="resetPage()"
          placeholder="Rechercher par nom"
          class="form-control"
        />
      </div>

      <div class="col-md-3">
        <!-- Filtre par état -->
        <select
          [(ngModel)]="selectedEtat"
          (ngModelChange)="resetPage()"
          class="form-control"
        >
          <option value="">Tous les états</option>
          <option *ngFor="let e of etats" [value]="e">
            {{ e }}
          </option>
        </select>
      </div>

      <div class="col-md-3">
        <!-- Filtre par date de début (format yyyy-MM-dd) -->
        <input
          type="date"
          [(ngModel)]="filterStartDate"
          (ngModelChange)="resetPage()"
          class="form-control"
        />
      </div>

      <div class="col-md-3">
        <!-- Filtre par date de fin (format yyyy-MM-dd) -->
        <input
          type="date"
          [(ngModel)]="filterEndDate"
          (ngModelChange)="resetPage()"
          class="form-control"
        />
      </div>
    </div>

    <!-- Liste des congés filtrée et paginée -->
    <div class="cards-container">
      <div
        class="card"
        *ngFor="let congee of (congees
          | congeeFilter : searchText : selectedEtat : filterStartDate : filterEndDate
          | paginate : { itemsPerPage: 5, currentPage: page })"
      >
        <div class="card-header">
          Congé {{ congee.id }}
        </div>
        <div class="card-body">
          <p><strong>Nom:</strong> {{ congee.nom }}</p>
          <p><strong>Date Début:</strong> {{ congee.dateDebut | date: 'dd/MM/yyyy' }}</p>
          <p><strong>Date Fin:</strong> {{ congee.dateFin | date: 'dd/MM/yyyy' }}</p>
          <p><strong>État:</strong> {{ congee.etat }}</p>
          <p><strong>Employé ID:</strong> {{ congee.employe?.id }}</p>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary btn-sm" (click)="editCongee(congee.id!)">
            Modifier
          </button>
          <button class="btn btn-danger btn-sm" (click)="deleteCongee(congee.id!)">
            Supprimer
          </button>
        </div>
      </div>
    </div>

    <!-- Contrôles de pagination -->
    <pagination-controls (pageChange)="page = $event"></pagination-controls>

    <button class="btn btn-success" [routerLink]="['/dashboard/add-congee']">
      Ajouter un congé
    </button>
  </div>
</main>
