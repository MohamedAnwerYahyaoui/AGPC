<main id="main" class="main">
  <div class="container">
    <div class="header">
      <h1>Gestion des Timesheets</h1>
      <div class="actions">
        <button mat-raised-button color="primary" (click)="openForm()">
          <mat-icon>add</mat-icon> Ajouter
        </button>
        <button mat-raised-button color="accent" (click)="exportToPDF()" [disabled]="dataSource.data.length === 0">
          <mat-icon>picture_as_pdf</mat-icon> Exporter PDF
        </button>
      </div>
    </div>

    <div class="filter-container">
      <mat-form-field appearance="outline">
        <mat-label>Filtrer</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Rechercher...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">{{element.date | date:'dd/MM/yyyy'}}</td>
        </ng-container>

        <!-- Heures Column -->
        <ng-container matColumnDef="heures">
          <th mat-header-cell *matHeaderCellDef>Heures</th>
          <td mat-cell *matCellDef="let element">{{element.heures}}h</td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">{{element.description}}</td>
        </ng-container>

        <!-- Tache Column -->
        <ng-container matColumnDef="tache">
          <th mat-header-cell *matHeaderCellDef>Tâche</th>
          <td mat-cell *matCellDef="let element">{{element.tache?.nom || '-'}}</td>
        </ng-container>

        <!-- User Column -->
        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
          <td mat-cell *matCellDef="let element">{{element.user?.username || '-'}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openForm(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteTimesheet(element.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Empty state -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [colSpan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>info</mat-icon>
              <span>Aucun timesheet trouvé</span>
            </div>
          </td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</main>
