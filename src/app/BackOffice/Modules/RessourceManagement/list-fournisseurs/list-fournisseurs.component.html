<main id="main" class="main">
  
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-12">
        
        <button class="btn btn-primary" routerLink="/dashboard/add-fournisseur">
          <i class="bi bi-plus"></i> 
        </button>
        <h3 class="text-center">Liste des fournisseurs</h3>

     
        <div class="mb-4">
          <input
            type="text"
            class="form-control"
            placeholder="Rechercher un fournisseur..."
            [(ngModel)]="searchQuery"
            (input)="filterFournisseurs()"
          />
         
          <ul class="list-group" *ngIf="showSuggestions && suggestions.length > 0">
            <li
              class="list-group-item list-group-item-action"
              *ngFor="let suggestion of suggestions"
              (click)="selectSuggestion(suggestion)"
            >
              {{ suggestion.name }} ({{ suggestion.contact }})
            </li>
          </ul>
        </div>

    
        <table class="table table-bordered table-striped">
          <thead class="thead-dark">
            <tr>
              <th scope="col">Nom</th>
              <th scope="col">Contact</th>
              <th scope="col">Numéro de téléphone</th>
              <th scope="col">Code QR</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let fournisseur of getPaginatedFournisseurs()">
              <td>{{ fournisseur.name }}</td>
              <td>{{ fournisseur.contact }}</td>
              <td>{{ fournisseur.numtel }}</td>
              <td>
              
                <td>
                  <div id="custom-qr-{{ fournisseur.id }}" class="custom-qr-container p-2 border rounded">
                    <div class="qr-background d-flex flex-column align-items-center">
                      <qrcode
                        [qrdata]="getQRCodeData(fournisseur)"
                        [width]="150"
                        [errorCorrectionLevel]="'H'"
                        [colorDark]="'#000000'"
                        [colorLight]="'#ffffff'"
                        [margin]="2"
                      ></qrcode>
                      <div class="qr-text text-center mt-2">
                        <h6 class="mb-1">{{ fournisseur.name }}</h6>
                        <small class="text-muted d-block">{{ fournisseur.contact }}</small>
                        <small class="text-muted">{{ fournisseur.numtel }}</small>
                      </div>
                    </div>
                  </div>
                  <button 
                    class="btn btn-sm btn-dark mt-2 w-100"
                    (click)="downloadCustomQRCode('custom-qr-' + fournisseur.id, 'qr-' + fournisseur.name + '.png')"
                  >
                    <i class="bi bi-download"></i> Télécharger
                  </button>
                </td>
              <td>
                <button class="btn btn-warning btn-sm me-2" (click)="editFournisseur(fournisseur)">
                  <i class="bi bi-pencil"></i> 
                </button>
                <button class="btn btn-danger btn-sm" (click)="deleteFournisseur(fournisseur.id)">
                  <i class="bi bi-trash"></i> 
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="pagination mt-4">
          <button
            *ngFor="let page of getTotalPages() | arrayFromNumber"
            (click)="changePage(page)"
            [class.active]="page === currentPage"
            class="btn btn-outline-primary btn-sm me-2"
          >
            {{ page }}
          </button>
        </div>

        
        <div *ngIf="selectedFournisseur" class="mt-3">
          <h4>Modifier le fournisseur</h4>
          <form (ngSubmit)="updateFournisseur()">
            <div class="mb-3">
              <label class="form-label">Nom :</label>
              <input type="text" class="form-control" [(ngModel)]="selectedFournisseur.name" name="name">
            </div>
            <div class="mb-3">
              <label class="form-label">Contact :</label>
              <input type="text" class="form-control" [(ngModel)]="selectedFournisseur.contact" name="contact">
            </div>
            <div class="mb-3">
              <label class="form-label">Numéro de téléphone :</label>
              <input type="text" class="form-control" [(ngModel)]="selectedFournisseur.numtel" name="numtel">
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <button type="button" class="btn btn-secondary ms-2" (click)="cancelEdit()">Annuler</button>
          </form>
        </div>
      </div> 
    </div>
  </div> 
</main>
