<main id="main" class="main">
    <div class="pagetitle">
      <h1>List of Zones</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Home</a></li>
          <li class="breadcrumb-item active">Zones</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->
  
    <section class="section">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Zones</h5>
  
              <!-- Table with stripped rows -->
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Description</th>
                    <th scope="col">Chantier</th>
                    <th scope="col">User</th>
  
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let zone of zones | paginate: { itemsPerPage: 10, currentPage: page }">
                    <td>{{zone?.id}}</td>
                    <td>{{zone?.nom}}</td>
                    <td>{{zone?.description}}</td>
                    <td>{{zone?.chantier?.nom}}</td>
                    <td>{{zone?.user?.nom}}</td>
  
                    <td>
                      <button class="btn btn-primary btn-sm" [routerLink]="['/dashboard/environnement/UpdateZone', zone.id]">
                        <i class="fas fa-edit"></i>
  
                      </button>
                      <button class="btn btn-danger btn-sm" (click)="deleteZone(zone.id)">                      <i class="fas fa-trash-alt"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <!-- End Table with stripped rows -->
  
              <pagination-controls (pageChange)="page = $event"></pagination-controls>
  
              <button class="btn btn-primary mt-3" [routerLink]="['/dashboard/environnement/AddZone']">Add Zone</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
